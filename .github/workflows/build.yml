name: Build ALSB3 Apex Tuner (PS4 PKG)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld unzip

      - name: Setup OpenOrbis PS4 Toolchain
        run: |
          sudo mkdir -p /opt/openorbis
          echo "Downloading OpenOrbis PS4 Toolchain (LLVM-18)..."
          curl --fail --location --retry 3 \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" \
            | sudo tar -xz -C /opt/openorbis
          
          TOOLCHAIN_ROOT="/opt/openorbis/OpenOrbis/PS4Toolchain"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_ROOT" >> $GITHUB_ENV
          echo "OO_TOOLCHAIN=$TOOLCHAIN_ROOT" >> $GITHUB_ENV
          echo "$TOOLCHAIN_ROOT/bin/linux" >> $GITHUB_PATH

      - name: Download SQLite amalgamation
        run: |
          mkdir -p third_party/sqlite
          curl --fail --location --retry 3 \
            "https://www.sqlite.org/2024/sqlite-amalgamation-3450300.zip" \
            -o /tmp/sqlite.zip
          unzip -q /tmp/sqlite.zip -d /tmp
          cp /tmp/sqlite-amalgamation-3450300/sqlite3.c third_party/sqlite/
          cp /tmp/sqlite-amalgamation-3450300/sqlite3.h third_party/sqlite/

      - name: Download SDL_ttf source
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.0.15/SDL2_ttf-2.0.15.tar.gz" \
            -o /tmp/SDL2_ttf.tar.gz
          tar -xzf /tmp/SDL2_ttf.tar.gz -C /tmp
          mkdir -p third_party/SDL_ttf
          cp /tmp/SDL2_ttf-2.0.15/SDL_ttf.c third_party/SDL_ttf/
          sed -i 's/int TTF_GlyphIsProvided(const TTF_Font \*font/int TTF_GlyphIsProvided(TTF_Font *font/' \
            third_party/SDL_ttf/SDL_ttf.c

      - name: Compile and Package ALSB3 Apex Tuner
        run: |
          make clean
          make
          ls -la

      - name: Upload ALSB3_Apex_Tuner Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALSB3-Apex-Tuner-PS4
          path: |
            *.pkg
            eboot.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.2
          name: "ALSB3 Apex Tuner v2.0.2 (alsb3 dev) - Legend Edition"
          body: |
            ## ALSB3 Apex Tuner v2.0.2 - Legend Edition (Title ID: APEX00001)
            **Developed by: alsb3 dev**
            
            ### What's New in v2.0.2:
            - **Interactive On-Screen Action Cards**: Replaced obscure text shortcuts with 4 large, interactive action buttons (GOD MODE, NET STRESS & BOOST, CLEAN & VACUUM, THERMAL GUARD).
            - **Resilient Multi-Source Game Scanner**: Broad SQLite table indexing (tbl_appinfo, tbl_appbrowse_*) + comprehensive filesystem fallback scanning across internal and external USB storage (`/user/appmeta`, `/mnt/ext0/user/appmeta`, `/user/app`).
            - **Seamless D-Pad DualShock 4 Navigation**: Smoothly switch between top Action Cards row and installed game library cards.
            - **Non-blocking Rescan**: Press [O] (Circle) to re-index games anytime.
            - **Fixed Corrupted Data & Module Loaders**: Retained complete internal Orbis service loaders and PRX dependencies.
          files: |
            *.pkg
            eboot.bin
